<!--
  Degraded. Ends on #c98a3e, which is the brand gradient's own deep stop — the one state
  tile that is allowed to look like Epic gold, because "something is off" is the state
  closest to normal. See icon.svg for the construction.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Epic Cash status: degraded">
  <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd166" />
    <stop offset="1" stop-color="#c98a3e" />
  </linearGradient>
  <rect width="32" height="32" rx="7" fill="url(#t)" />
  <g fill="#12100d">
    <rect x="8" y="8" width="4" height="16" />
    <rect x="12" y="8" width="12" height="3.8" />
    <rect x="12" y="14.1" width="8" height="3.8" />
    <rect x="12" y="20.2" width="3.4" height="3.8" />
    <rect x="16.3" y="20.2" width="3.4" height="3.8" />
    <rect x="20.6" y="20.2" width="3.4" height="3.8" />
  </g>
</svg>
