# Rate-limit zones for status.btlabs.uk (epic-status).
#
# Source of truth: /home/bt/epic-status/ops/nginx/status-ratelimit.conf
# Install with:
#   sudo install -o root -g root -m 0644 \
#     /home/bt/epic-status/ops/nginx/status-ratelimit.conf \
#     /etc/nginx/conf.d/status-ratelimit.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# conf.d/, NOT sites-available/. limit_req_zone and limit_conn_zone are http
# context directives; in a server block they are a config error. nginx.conf
# includes conf.d/*.conf (line 59) before sites-enabled/* (line 60), so the zones
# exist by the time the vhost references them. Install this file first -- a vhost
# naming an undeclared zone fails nginx -t, which is the right way round but still
# a failed reload.
#
# Zone names are prefixed status_ rather than epic_ so they stay distinct from
# conf.d/epic-ratelimit.conf, which is shared by the mainnet and floonet node
# vhosts. Two files must never claim the same zone name in one http context.
#
# 10m of shared memory holds on the order of 160k distinct client addresses,
# which is far more than this site will see and costs nothing worth counting.
#
# Why these exist at all: the whole site is public and unauthenticated by design,
# and the submit endpoint turns a request into outbound probes against a
# third-party host. Without a limit, abuse of this page is abuse of somebody
# else's server with our IP on it.

# Board pages and static assets. Loose on purpose: this is a page people reload
# during an incident, often several at once from behind one NAT address, and a
# 429 from the thing that is supposed to tell you what is broken is a bad answer.
limit_req_zone $binary_remote_addr zone=status_page:10m rate=30r/s;

# JSON reads. Cheap to serve -- answers come from an in-memory snapshot -- but
# trivially scriptable in a tight loop, and each response is larger than a page
# view. Moderate.
limit_req_zone $binary_remote_addr zone=status_api:10m rate=10r/s;

# POST /api/v1/submit. Tight, because one accepted request writes a row and then
# schedules repeated probes against a host the submitter chose. Nobody adds two
# servers a second; a submission flood is either a mistake or a reflection
# attack. 1r/m with a small burst covers a human correcting a typo.
limit_req_zone $binary_remote_addr zone=status_submit:10m rate=1r/m;

# Concurrent connections per client, so one peer cannot hold workers open with
# many simultaneous requests. On a 2-vCPU box the worker count is small enough
# that this matters more than the request rate does.
limit_conn_zone $binary_remote_addr zone=status_conn:10m;

# 429 rather than nginx's default 503. A 503 from a status page reads as "the
# monitored systems are down"; 429 is what HTTP clients expect for throttling and
# is what makes the limit debuggable from the client side.
limit_req_status 429;
limit_conn_status 429;
