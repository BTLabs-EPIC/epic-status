##
# status.btlabs.uk -- Epic Cash node/relay status page, public HTTPS front end.
#
# Source of truth: /home/bt/epic-status/ops/nginx/status.btlabs.uk.conf
# Install with:
#   sudo install -o root -g root -m 0644 \
#     /home/bt/epic-status/ops/nginx/status.btlabs.uk.conf \
#     /etc/nginx/sites-available/epic-status
#   sudo ln -sfn /etc/nginx/sites-available/epic-status \
#     /etc/nginx/sites-enabled/epic-status
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires ops/nginx/status-ratelimit.conf to be installed into
# /etc/nginx/conf.d/ FIRST. The zones referenced below do not exist without it
# and nginx -t fails closed on the unknown zone name.
#
# ALWAYS read the output of `nginx -t` before reloading. This nginx currently
# serves 13 vhosts from sites-enabled/, so a bad config here takes down twelve
# other domains -- including node.btlabs.uk, a live mainnet seed node -- not
# just this one.
#
# The application listens only on 127.0.0.1:13431. nginx is the only public path
# in. The submit endpoint accepts unauthenticated writes, which is deliberate
# (anyone may add a server) and is why the loopback bind and the rate limits
# below are the whole access-control story.
#
# `listen 443 ssl http2` uses http2 as a LISTEN FLAG, not the `http2 on;`
# directive: this box runs nginx 1.24.0 and the per-server directive only
# arrived in 1.25.1. The directive form is a hard config error here.
##

server {
    listen 80;
    listen [::]:80;
    server_name status.btlabs.uk;

    # Keep the ACME path on plain HTTP. A renewal must never depend on the
    # certificate it is renewing -- an expired or broken cert would otherwise
    # make the one request that could fix it unanswerable.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name status.btlabs.uk;

    ssl_certificate /etc/letsencrypt/live/status.btlabs.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.btlabs.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/epic-status.access.log;
    error_log  /var/log/nginx/epic-status.error.log;

    # One endpoint accepts a body and it is a short JSON submission: a hostname,
    # a kind, an optional operator string. 8k is far more than that needs, and
    # the application applies its own bound as well. Raised only where required.
    client_max_body_size 8k;

    # nginx.conf sets `gzip on` but leaves gzip_types commented out, so by default
    # only text/html is compressed and the stylesheet and scripts ship raw. Declared
    # here rather than in nginx.conf so the change cannot affect the other twelve
    # vhosts on this server. woff2 is already compressed and is deliberately absent.
    gzip_types text/css text/plain text/javascript application/javascript application/json
               application/rdap+json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # HSTS is the one security header nginx must own -- the application cannot
    # meaningfully assert it, since it never sees the TLS layer. CSP,
    # X-Content-Type-Options, Referrer-Policy and X-Frame-Options are set by the
    # application on every response, error responses included. Do not duplicate
    # them here: browsers intersect multiple CSP headers, and working out which
    # of two sources broke the board is miserable.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Rate limits are PER LOCATION, never at server level -----------------
    # Neither limit_req nor limit_conn accepts `off`, so a limit declared at
    # server level cannot be lifted in a location that must not carry it. The
    # only way to keep the tiers independent is to state each one where it
    # applies. Zones live in conf.d/status-ratelimit.conf.
    #
    # Three tiers, loosest first:
    #   status_page   -- board pages and assets. A human refreshing hard, or one
    #                    office behind a single NAT address, must not be told 429
    #                    by a page whose entire job is to be reachable.
    #   status_api    -- JSON reads. Cheap, but scriptable in a loop.
    #   status_submit -- POST /api/v1/submit. Writes rows and schedules probes
    #                    against a third-party host, so an abuser here spends
    #                    somebody else's bandwidth, not only ours.

    # Submission. Most specific location, declared first for legibility; nginx
    # matches `=` before prefixes regardless of order.
    #
    # POST-only at this layer too: a GET that reached the handler would be
    # rejected by the application, but a crawler should never get that far.
    location = /api/v1/submit {
        limit_except POST { deny all; }
        limit_req zone=status_submit burst=3 nodelay;
        limit_conn status_conn 4;

        # Slightly above the application's own body bound so an oversized
        # submission is refused by the application with a JSON error the form can
        # display, rather than by nginx with a bare HTML 413 it cannot parse.
        client_max_body_size 12k;

        proxy_pass http://127.0.0.1:13431;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # A submission validates the target synchronously before it is accepted,
        # which means one outbound probe to a host that may be slow or dead.
        proxy_read_timeout 30s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @down;
    }

    # JSON API.
    location /api/ {
        access_log /var/log/nginx/epic-status.api.access.log status_api_anon;
        limit_req zone=status_api burst=20 nodelay;
        limit_conn status_conn 8;

        proxy_pass http://127.0.0.1:13431;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @down;
    }

    # Static assets. Loose tier: a single board render pulls several of these at
    # once, so anything tighter would throttle one page load. Kept out of the
    # access log because they say nothing the page view did not already say.
    location /static/ {
        limit_req zone=status_page burst=60 nodelay;
        proxy_pass http://127.0.0.1:13431;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # The board and everything else.
    location / {
        limit_req zone=status_page burst=40 nodelay;
        limit_conn status_conn 16;

        proxy_pass http://127.0.0.1:13431;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @down;
    }

    # For a status page, nginx's default 502 is the worst possible failure mode:
    # it is indistinguishable from the infrastructure being monitored having
    # failed, and it is the reading a visitor will act on. Say plainly that the
    # observer is what broke and that the nodes are probably fine.
    #
    # Deliberately self-contained -- inline markup, no upstream, no asset
    # fetches. It has to work when nothing else does.
    location @down {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        return 503 '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Status page unavailable</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{background:#08080a;color:#fff9f9;font-family:system-ui,sans-serif;
display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:1rem}
h1{font-weight:600;font-size:1.25rem}p{color:#8a8a8a;max-width:44ch;line-height:1.6}
strong{color:#fff9f9;font-weight:600}code{color:#f6d471}</style></head><body><div>
<h1>The status page is down</h1>
<p><strong>This tells you nothing about the nodes.</strong> The monitor itself is
restarting or unreachable; the network it watches is very likely fine.</p>
<p>Try again in a few seconds.</p>
<p><code>status.btlabs.uk</code></p></div></body></html>';
    }
}
