# status onion service backend. Source of truth: /home/bt/epic-status/ops/nginx/status-onion.conf
# Install: sudo install -m0644 this /etc/nginx/conf.d/status-onion.conf && sudo nginx -t && sudo systemctl reload nginx
# Listens on loopback only; reached solely by the epic-status-tor unit. Read-only (GET/HEAD)
# except the two submission routes, POST /add and POST /api/v1/submit, which take an optional
# server icon. No access log, no client IP forwarded (every Tor request appears as 127.0.0.1
# anyway), no redirects to clearnet. /admin is refused.
limit_req_zone $server_name zone=status_onion:1m rate=20r/s;

# Submissions over Tor get the clearnet per-address limits (1r/m, burst 3, 1100k bodies).
# Every Tor visitor is one address here, so this is one allowance shared by all of them:
# the onion can be crowded out of submitting, never used to submit more than one client
# could on the clearnet. The application's own image limits see the same single address.
map $request_method $status_onion_post_key {
    POST    $server_name;
    default "";
}
limit_req_zone $status_onion_post_key zone=status_onion_submit:1m rate=1r/m;

server {
    listen 127.0.0.1:13432;
    server_name _;
    access_log off;
    error_log /var/log/nginx/epic-status-onion.error.log crit;
    client_max_body_size 1k;
    gzip_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Method and route together: GET/HEAD anywhere, POST only to the two submission routes.
    set $status_onion_call "$request_method $uri";
    if ($status_onion_call !~ "^(GET|HEAD) |^POST /(add|api/v1/submit)$") { return 405; }
    location ^~ /admin { return 404; }

    location = /api/v1/submit {
        limit_except POST { deny all; }
        limit_req zone=status_onion_submit burst=3 nodelay;
        client_max_body_size 1100k;
        proxy_pass http://epic_status_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host status.btlabs.uk;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Epic-Onion 1;
        proxy_hide_header cross-origin-opener-policy;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /add {
        limit_req zone=status_onion burst=60 nodelay;
        limit_req zone=status_onion_submit burst=3 nodelay;
        client_max_body_size 1100k;
        proxy_pass http://epic_status_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host status.btlabs.uk;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Epic-Onion 1;
        proxy_hide_header cross-origin-opener-policy;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # EPIC price for wallets (CoinGecko, refreshed every 3 min by epic-price.timer,
    # /home/bt/epic-price). Wallets with Tor on read it here instead of CoinGecko.
    location = /api/v1/price.json {
        limit_req zone=status_onion burst=20 nodelay;
        alias /var/www/epic-price/price.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=60" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        limit_req zone=status_onion burst=60 nodelay;
        proxy_pass http://epic_status_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host status.btlabs.uk;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        # Tells the app this is the onion: it leaves the "Also on Tor" footer row out.
        # The clearnet block blanks the same header. See web.onion_request.
        proxy_set_header X-Epic-Onion 1;
        # The app sends COOP for the clearnet. Over plain http on an onion a browser
        # ignores it and logs an error on every page; nothing is lost by dropping it.
        proxy_hide_header cross-origin-opener-policy;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
