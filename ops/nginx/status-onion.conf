# status onion service backend. Source of truth: /home/bt/epic-status/ops/nginx/status-onion.conf
# Install: sudo install -m0644 this /etc/nginx/conf.d/status-onion.conf && sudo nginx -t && sudo systemctl reload nginx
# Listens on loopback only; reached solely by the epic-status-tor unit. Read-only (GET/HEAD),
# no access log, no client IP forwarded (every Tor request appears as 127.0.0.1 anyway),
# no redirects to clearnet. /api/v1/submit and /admin are refused.
limit_req_zone $server_name zone=status_onion:1m rate=20r/s;

server {
    listen 127.0.0.1:13432;
    server_name _;
    access_log off;
    error_log /var/log/nginx/epic-status-onion.error.log crit;
    client_max_body_size 1k;
    gzip_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location ^~ /admin { return 404; }
    location = /api/v1/submit { return 404; }

    location / {
        limit_req zone=status_onion burst=60 nodelay;
        proxy_pass http://epic_status_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host status.btlabs.uk;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
