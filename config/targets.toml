# Seed targets — Epic Cash.
#
# This file is the canonical list, kept in git so that adding or removing a
# community server is a reviewable change. Public submissions land in SQLite
# instead and are promoted automatically once they answer; see docs in README.
#
# Seed entries are exempt from auto-removal. `node.epiccash.com` being down is
# the single most important thing this page can report, so it must never vanish
# for the crime of being down.
#
# Every entry below was probed from a UK host while this file was written; the
# per-entry comments record what answered and what did not. Those notes are
# observations from one vantage point on one day, not verdicts — the point of the
# service is to replace them with continuous measurement.
#
# `endpoint` is a URL, not host:port, because both deployment shapes exist in the
# wild: the node's own listener exposed directly on 3413, or the listener kept on
# loopback with nginx terminating TLS on 443. The second is the better deployment
# and a host:port model cannot express it.
#
# `chain` is optional and defaults to "mainnet", so an entry that says nothing
# about a network means what every entry in this file meant before floonet was
# added. The two chains are judged entirely separately — see models.Chain — and
# a floonet host at height 400 is never compared against mainnet's tip.

# ---------------------------------------------------------------------- nodes

[[node]]
slug = "node.epiccash.com"
display_host = "node.epiccash.com:3413"
endpoint = "https://node.epiccash.com:3413"
p2p = "node.epiccash.com:3414"
operator = "Epic Cash"
label = "Default node"
# Answered get_tip in ~120 ms, unauthenticated, CORS *. Shares its address
# (144.202.75.237, Vultr) with epicbox.epiccash.com: the default node and the
# default relay are one machine, so a single outage takes out both. Listed as two
# rows because they are two services, with the shared address surfaced in the
# co-hosting count rather than hidden.
notes = "Shares a host with epicbox.epiccash.com"

[[node]]
slug = "node.epicnet.us"
display_host = "node.epicnet.us:3413"
endpoint = "https://node.epicnet.us:3413"
p2p = "node.epicnet.us:3414"
operator = "epicnet.us"
# Answered get_tip, agreeing on height with node.epiccash.com. Also co-hosted
# with its own relay on 155.138.197.0 (Vultr).
notes = "Shares a host with epicbox.epicnet.us"

[[node]]
slug = "node.btlabs.uk"
display_host = "node.btlabs.uk"
# No port: the node's API listens on 127.0.0.1:3413 only and nginx fronts it on
# 443. Answered get_tip in 41 ms. This is the deployment shape to recommend to
# operators, and the reason `endpoint` is a URL.
endpoint = "https://node.btlabs.uk"
operator = "btlabs"
ours = true
country = "GB"

# Four addresses were listed here as "documented seeds" and have been removed.
# They were never seeds. They come from a commented-out example inside the node's
# own config generator (config/src/comments.rs:272 in EpicCash/epic), which shows
# an operator how to write a manual `seeds = [...]` list if they switch seeding
# from DNS to List. Nothing reads it, nobody maintains it, and all four failed
# every probe from the day this page started — 663 consecutive failures, zero
# successes.
#
# Real mainnet bootstrap does not use a list at all: Seeding::default() is
# DNSSeed, which resolves the single hostname in MAINNET_DNS_SEEDS
# (servers/src/epic/seed.rs:38) — node.epiccash.com, listed above. That name
# currently has one A record, on the same host that serves the default Epicbox
# relay. Worth knowing; not something this file can fix.
#
# Their history is preserved: reconcile_seeds disables a removed seed rather than
# deleting it, so the rows stay in `checks`.

[[node]]
slug = "floo-node.btlabs.uk"
display_host = "floo-node.btlabs.uk"
chain = "floonet"
# Same deployment shape as node.btlabs.uk: the node's API on loopback, nginx on
# 443. Answered get_tip in 44 ms at height 390 running 4.0.4 — a young chain, and
# the reason chains are scored separately. Judged against floonet's own tip, so
# being three and a half million blocks below mainnet is not a fault.
endpoint = "https://floo-node.btlabs.uk"
operator = "btlabs"
ours = true
country = "GB"
notes = "Floonet node. Serves the floonet explorer and wallet"

# ------------------------------------------------------------------- epicbox
#
# All relays speak wss on 443 with no path. The probe opens the socket, reads the
# one frame the relay pushes unprompted — {"type":"Challenge","str":...} — and
# closes. No keys, no signature, no writes.
#
# Do not add an HTTP GET probe here. Rendering a relay's own status page fires
# three outbound TLS connections to other relays, so polling it turns this
# service into an amplifier aimed at the hosts it exists to help.

[[epicbox]]
slug = "epicbox.epiccash.com"
display_host = "epicbox.epiccash.com"
endpoint = "wss://epicbox.epiccash.com:443/"
operator = "Epic Cash"
label = "Default relay"
# Challenge frame in ~1.3 s. This is the wallet's built-in default, so its health
# is the single most consequential row in this group.
notes = "Wallet default. Shares a host with node.epiccash.com"

[[epicbox]]
slug = "epicbox.epicnet.us"
display_host = "epicbox.epicnet.us"
endpoint = "wss://epicbox.epicnet.us:443/"
operator = "epicnet.us"
notes = "Shares a host with node.epicnet.us"

[[epicbox]]
slug = "epicbox.stackwallet.com"
display_host = "epicbox.stackwallet.com"
endpoint = "wss://epicbox.stackwallet.com:443/"
operator = "Cypher Stack"
label = "Stack Wallet"
country = "FI"
# Fastest of the three that answered, ~590 ms. Hetzner Finland.
notes = "Used by Stack Wallet mobile"

[[epicbox]]
slug = "flooepicbox.btlabs.uk"
display_host = "flooepicbox.btlabs.uk"
chain = "floonet"
endpoint = "wss://flooepicbox.btlabs.uk:443/"
operator = "btlabs"
ours = true
country = "GB"
# Challenge frame in 50 ms, protocol 3.0.0.
#
# The name has no hyphen on purpose, and the alternatives are worth recording
# because both are already configured on this host and both are wrong here:
# `floo-epicbox.btlabs.uk` is refused by this service's own submit validator,
# since Epicbox addresses admit only letters, digits and dots — a wallet cannot
# parse an address on a hyphenated relay even though the socket answers perfectly.
# `epicbox.btlabs.uk` resolves and serves TLS but refuses the websocket upgrade
# with HTTP 400, so it is a certificate SAN rather than a relay endpoint.
notes = "Floonet relay"

# Three relays were listed here and have been removed: epicbox.fastepic.eu and
# epicbox.btlabs.tech, neither of which resolves, and epicbox.51pool.online,
# which resolves but times out during the handshake. None ever completed one.
# They appear in the relay software's hardcoded server list, so wallets may still
# be pointed at them — but a row that has never once been green reports nothing
# except that this file is out of date, and four permanent failures next to three
# permanent successes makes the board's own red mean less.
#
# History is kept; removing a seed disables the row rather than deleting it.

# ---------------------------------------------------------------------- pools
#
# Pools have no protocol. Each one exposes a hand-rolled JSON stats endpoint, so
# each needs a named `adapter` implemented in src/epic_status/probes/pool.py, and
# adding one is a code change rather than a config change. That is the intended
# friction: the alternative is guessing at a third party's response shape and
# silently reporting nonsense when it changes.
#
# `endpoint` is the base of the API, which is not always the public host —
# epicmine serves its site on epicmine.io and its API on api.epicmine.io. The
# adapter supplies the path.
#
# Only reachability, chain height, miner and worker counts, the fee and the last
# block found are collected. Not hashrate: it is a large fast-moving number that
# says nothing about whether a pool is working, and on a status board it would be
# read as a ranking.

[[pool]]
slug = "epicmine.io"
display_host = "epicmine.io"
endpoint = "https://api.epicmine.io"
adapter = "epicmine"
operator = "EpicMine"
# Stats answered in ~2.8 s, which is why pools are polled at 30 s and not 5 s.
# Regional stratum hosts in Germany, the United States and Singapore; the API
# itself is one origin, so the latency below describes that origin only.
notes = "Stratum in DE, US and SG. Fee 2.5%"

[[pool]]
slug = "epic.iniaku.my.id"
display_host = "epic.iniaku.my.id"
endpoint = "https://epic.iniaku.my.id"
adapter = "iniaku"
operator = "IniAku"
# Answered in ~450 ms. Reports its fee as the string "0.02" rather than a
# percentage, which the adapter converts — see fee_is_fraction in probes/pool.py.
notes = "Fee 2%"
