# ------------------------------------------------------------------- epicbox
#
# All relays speak wss on 443 with no path. The probe opens the socket, reads the
# one frame the relay pushes unprompted — {"type":"Challenge","str":...} — and
# closes. No keys, no signature, no writes.
#
# Do not add an HTTP GET probe here. Rendering a relay's own status page fires
# three outbound TLS connections to other relays, so polling it turns this
# service into an amplifier aimed at the hosts it exists to help.

[[epicbox]]
slug = "epicbox.epiccash.com"
display_host = "epicbox.epiccash.com"
endpoint = "wss://epicbox.epiccash.com:443/"
operator = "Epic Cash"
label = "Default relay"
# Challenge frame in ~1.3 s. This is the wallet's built-in default, so its health
# is the single most consequential row in this group.
notes = "Wallet default. Shares a host with node.epiccash.com"

[[epicbox]]
slug = "epicbox.epicnet.us"
display_host = "epicbox.epicnet.us"
endpoint = "wss://epicbox.epicnet.us:443/"
operator = "epicnet.us"
notes = "Shares a host with node.epicnet.us"

[[epicbox]]
slug = "epicbox.stackwallet.com"
display_host = "epicbox.stackwallet.com"
endpoint = "wss://epicbox.stackwallet.com:443/"
operator = "Cypher Stack"
label = "Stack Wallet"
country = "FI"
# Fastest of the three that answered, ~590 ms. Hetzner Finland.
notes = "Used by Stack Wallet mobile"

# The two below appear in the relay software's own hardcoded server list, which
# means wallets are configured to use them, but neither resolves: fastepic.eu
# returns no address for the name and btlabs.tech does not resolve at all. A
# wallet pointed at either cannot send. Listed so the page says so out loud.

[[epicbox]]
slug = "epicbox.fastepic.eu"
display_host = "epicbox.fastepic.eu"
endpoint = "wss://epicbox.fastepic.eu:443/"
operator = "fastEpic"
notes = "In the relay's built-in server list; DNS did not resolve when last probed"

[[epicbox]]
